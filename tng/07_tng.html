<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>form tng</title>
</head>
<body>

<caption><h1>회원가입을 환영합니다</h1></caption>

<form action="" method="post">
  <!-- method의 "get"은 정보를 보여서 가져감 #예시: 우리가 홈페이지에서 url를 검색
   , "post"는 정보를 내부적으로 숨겨서 가져감-->

<fieldset>
     <legend>사용자 정보</legend>
    <ul>
       <li>
        <label for="account">아이디</label>
       <input 
       type="text"
       id="account"
       required minlength="4" 
       maxlength="10" 
       placeholder="4자 ~ 10자 사이, 공백없이">
       </li>

       <li>
        <label for="account">이메일</label>
        <input type="email"
               id="email">
       </li>

       <li>
        <label for="password">비밀번호</label>
       <input type="password" id="password" placeholder="문자와 숫자, 특수 기호 포함">
       </li>

       <li>
        <label for="password Check">비밀번호 확인</label>
       <input type="password" 
                id="password Check">
       </li>

       <li>
        <label for="path">가입 경로</label>
        <select name="path" id="path">         
        <option value="etc" selected>기타</option>  
        <option value="homepage">홈페이지 </option>  
        </select>
       </li>

       <li>
        <!-- label 태그의 for과 input의 id는 서로 같아야 한다. 식별을 해야 하기 때문에  -->
       <label for="memo">메모</label>
        <textarea 
        name="memo" 
        id="memo" 
        cols="30" 
        rows="10" 
        maxlength="10" 
        placeholder="남길 말씀이 있다면여기에"
        ></textarea>
       </li>

    </ul>
</fieldset>


<fieldset>
  <legend>이벤트와 새로운 소식</legend>
  <div>
    <!--  input의 radio는 value를 써야 한다. 
      (사용자가 직접적는 건 해당사항 없음, 체크 박스 등등의 선택해야 하는 것들임)-->
    <input type="radio" name="event" id="y" value="y">
    <label for="y">메일 수신</label>
    <input type="radio" name="n" id="n" checked>
    <label for="n">메일 수신 안 함</label>
  </div>
</fieldset>

<button type="submit">가입하기</button>
<button type="reset">취소</button>

</form>

</body>
</html>
